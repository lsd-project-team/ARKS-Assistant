name: Coding Acceptance

on:
  workflow_dispatch:
    inputs:
      cases:
        description: "逗号分隔的用例（留空=全部）"
        required: false
        default: ""
      rounds:
        description: "轮数"
        required: false
        default: "1"

jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ARKS_API_KEY: ${{ secrets.ARKS_API_KEY }}
      ARKS_BASE_URL: ${{ vars.ARKS_BASE_URL }}
      ARKS_MODEL: ${{ vars.ARKS_MODEL }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install backend dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e backend
          pip install "pytest>=8.3" "pytest-asyncio>=1.0" "ruff>=0.11"

      - name: Write model settings
        shell: pwsh
        run: |
          if (-not $env:ARKS_API_KEY) { throw "缺少 secrets.ARKS_API_KEY" }
          $base = if ($env:ARKS_BASE_URL) { $env:ARKS_BASE_URL } else { "https://api.deepseek.com/anthropic" }
          $model = if ($env:ARKS_MODEL) { $env:ARKS_MODEL } else { "deepseek-flash" }
          $settings = @{
            model = @{
              protocol = "anthropic"
              base_url = $base
              model = $model
              api_key = $env:ARKS_API_KEY
              context_tokens = 1048576
              output_tokens = 65536
              temperature = 0.4
              timeout_seconds = 120
              summary_model = ""
            }
          }
          New-Item -ItemType Directory -Force data | Out-Null
          $settings | ConvertTo-Json -Depth 5 | Set-Content data/settings.private.json -Encoding utf8

      - name: Run coding acceptance
        shell: pwsh
        run: |
          $cases = "${{ inputs.cases }}"
          $rounds = "${{ inputs.rounds }}"
          if (-not $cases) { $cases = "python-cli,dotnet-console,bugfix-python,refactor-python,bugfix-multi,feature-python,web-static,winforms-tool" }
          python scripts/acceptance/coding/ci.py --cases $cases --rounds $rounds

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coding-acceptance-reports
          path: output/acceptance/coding-ci-*
          if-no-files-found: warn
