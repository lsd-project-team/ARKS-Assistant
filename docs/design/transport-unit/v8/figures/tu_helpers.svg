<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1040" viewBox="0 0 2400 1040">
<rect width="100%" height="100%" fill="white"/>
<text x="1200" y="70" font-family="Microsoft YaHei" font-size="54" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#172B3A">同样能创建TU  但对象由不同地方持有</text>
<text x="473.3333333333333" y="210" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#246B99">生产区段</text>
<text x="473.3333333333333" y="360" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">保存当前TU</text>
<text x="473.3333333333333" y="456" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">部分在线示教可替换</text>
<text x="1200.0" y="210" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#246B99">辅助窗口</text>
<text x="1200.0" y="360" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">可新建自己的样本</text>
<text x="1200.0" y="456" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">不一定赋回区段</text>
<text x="1926.6666666666665" y="210" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#246B99">补偿工作模式</text>
<text x="1926.6666666666665" y="360" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">先创建测试TU</text>
<text x="1926.6666666666665" y="456" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">特定条件下再S2重建</text>
<text x="1200" y="940" font-family="Microsoft YaHei" font-size="49" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#B75D21">新对象不自动复制旧产品Info</text></svg>
