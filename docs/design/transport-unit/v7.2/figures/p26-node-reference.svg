<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="930" viewBox="0 0 2400 930"><rect width="100%" height="100%" fill="white"/>
<rect x="70" y="80" width="970" height="220" fill="#eaf4ed" stroke="#a5b5c1" stroke-width="3"/>
<text x="555.0" y="156.0" fill="#162e43" font-family="Microsoft YaHei" font-size="51" font-weight="700" text-anchor="middle" dominant-baseline="central">原配置节点 N</text>
<text x="555.0" y="224.0" fill="#162e43" font-family="Microsoft YaHei" font-size="46" font-weight="400" text-anchor="middle" dominant-baseline="central">创建时关联运行对象 B</text>
<rect x="1360" y="80" width="970" height="220" fill="#edf0f3" stroke="#a5b5c1" stroke-width="3"/>
<text x="1845.0" y="156.0" fill="#162e43" font-family="Microsoft YaHei" font-size="51" font-weight="700" text-anchor="middle" dominant-baseline="central">另一份配置节点 N′</text>
<text x="1845.0" y="224.0" fill="#162e43" font-family="Microsoft YaHei" font-size="46" font-weight="400" text-anchor="middle" dominant-baseline="central">相同名称／ID／ConfigName</text>
<rect x="70" y="540" width="970" height="220" fill="#eaf1f9" stroke="#a5b5c1" stroke-width="3"/>
<text x="555.0" y="616.0" fill="#162e43" font-family="Microsoft YaHei" font-size="51" font-weight="700" text-anchor="middle" dominant-baseline="central">用 N 反查</text>
<text x="555.0" y="684.0" fill="#162e43" font-family="Microsoft YaHei" font-size="46" font-weight="400" text-anchor="middle" dominant-baseline="central">返回关联的 B</text>
<rect x="1360" y="540" width="970" height="220" fill="#fff0df" stroke="#a5b5c1" stroke-width="3"/>
<text x="1845.0" y="616.0" fill="#162e43" font-family="Microsoft YaHei" font-size="51" font-weight="700" text-anchor="middle" dominant-baseline="central">用 N′ 反查</text>
<text x="1845.0" y="684.0" fill="#162e43" font-family="Microsoft YaHei" font-size="46" font-weight="400" text-anchor="middle" dominant-baseline="central">未命中则抛异常</text>
<polyline points="555,300 555,540" fill="none" stroke="#4d6070" stroke-width="5"/>
<polygon points="555,540 544.9957927154417,519.2897166458885 565.0042072845583,519.2897166458885" fill="#4d6070"/>
<polyline points="1845,300 1845,540" fill="none" stroke="#b65f17" stroke-width="5"/>
<polygon points="1845,540 1834.9957927154417,519.2897166458885 1855.0042072845583,519.2897166458885" fill="#b65f17"/>
<text x="1200" y="425" fill="#162e43" font-family="Microsoft YaHei" font-size="57" font-weight="700" text-anchor="middle" dominant-baseline="central">接口比较节点对象引用</text>
<text x="1200" y="850" fill="#162e43" font-family="Microsoft YaHei" font-size="50" font-weight="700" text-anchor="middle" dominant-baseline="central">名字与ID相同，不意味着是同一节点对象</text></svg>