<polygon points="620,705 599.2897166458885,715.0042072845583 599.2897166458885,694.9957927154417" fill="#4d6070"/>
<circle cx="125" cy="705" r="13" fill="#b65f17"/>
<text x="175" y="675" fill="#162e43" font-family="Microsoft YaHei" font-size="42" font-weight="400" text-anchor="middle" dominant-baseline="central">P1</text>
<circle cx="345" cy="595" r="13" fill="#b65f17"/>
<text x="395" y="565" fill="#162e43" font-family="Microsoft YaHei" font-size="42" font-weight="400" text-anchor="middle" dominant-baseline="central">P2</text>
<circle cx="565" cy="375" r="13" fill="#b65f17"/>
<text x="615" y="345" fill="#162e43" font-family="Microsoft YaHei" font-size="42" font-weight="400" text-anchor="middle" dominant-baseline="central">P3</text>
<circle cx="345" cy="485" r="15" fill="#245b87"/>
<text x="450" y="430" fill="#245b87" font-family="Microsoft YaHei" font-size="40" font-weight="400" text-anchor="middle" dominant-baseline="central">锚点(2,2)</text>
<text x="400" y="840" fill="#162e43" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central">X由P1、P3取均值</text>
<text x="400" y="910" fill="#162e43" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central">Y由P2、P3取均值</text>
<text x="400" y="1000" fill="#4d6070" font-family="Microsoft YaHei" font-size="42" font-weight="400" text-anchor="middle" dominant-baseline="central">锚点不必等于某个采集点</text>
