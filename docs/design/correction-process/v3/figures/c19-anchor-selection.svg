<text x="1200" y="185" fill="#162e43" font-family="Microsoft YaHei" font-size="54" font-weight="700" text-anchor="middle" dominant-baseline="central">两点定角</text>
<text x="2000" y="185" fill="#162e43" font-family="Microsoft YaHei" font-size="54" font-weight="700" text-anchor="middle" dominant-baseline="central">三点拟合圆</text>
