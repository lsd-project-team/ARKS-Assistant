<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1190" viewBox="0 0 2400 1190"><rect width="100%" height="100%" fill="white"/>
<text x="1200" y="65" fill="#162e43" font-family="Microsoft YaHei" font-size="56" font-weight="700" text-anchor="middle" dominant-baseline="central">先明确怎样选点 再理解怎样更新坐标</text>
<polyline points="800,140 800,1110" fill="none" stroke="#d5dee5" stroke-width="2"/>
<polyline points="1600,140 1600,1110" fill="none" stroke="#d5dee5" stroke-width="2"/>
