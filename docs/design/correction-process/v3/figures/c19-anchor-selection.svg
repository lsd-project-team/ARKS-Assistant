<text x="1200" y="410" fill="#162e43" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central">示教连线与识别连线</text>
<text x="1200" y="840" fill="#162e43" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central">连线角差 = 0.1 rad</text>
<text x="1200" y="910" fill="#162e43" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central">先取Atan(0.1)</text>
<text x="1200" y="1000" fill="#4d6070" font-family="Microsoft YaHei" font-size="42" font-weight="400" text-anchor="middle" dominant-baseline="central">再减父链全局角</text>
