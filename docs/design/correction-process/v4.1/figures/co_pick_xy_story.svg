<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1040" viewBox="0 0 2400 1040">
<rect width="100%" height="100%" fill="white"/>
<text x="1200" y="70" font-family="Microsoft YaHei" font-size="54" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#172B3A">仍在同一静态华夫盒路线  单位毫米</text>
<text x="473.3333333333333" y="210" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#246B99">Mark换算起点</text>
<text x="473.3333333333333" y="360" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">(200, 100)</text>
<text x="473.3333333333333" y="456" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">减偏心 (0.05, −0.02)</text>
<polyline points="751.6666666666666,525 911.6666666666666,525" stroke="#246B99" stroke-width="7" fill="none"/>
<polygon points="911.6666666666666,525 887.3545949031444,536.7440694210032 887.3545949031444,513.2559305789968" fill="#246B99" stroke="#246B99" stroke-width="4"/>
<text x="1200.0" y="210" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#246B99">换到芯片中心</text>
<text x="1200.0" y="360" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">加取料量 (0.01, 0.03)</text>
<text x="1200.0" y="456" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">减转过角的中心向量</text>
<text x="1200.0" y="552" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">约 (0.507, 0.182)</text>
<polyline points="1478.3333333333333,525 1638.3333333333333,525" stroke="#246B99" stroke-width="7" fill="none"/>
<polygon points="1638.3333333333333,525 1614.021261569811,536.7440694210032 1614.021261569811,513.2559305789968" fill="#246B99" stroke="#246B99" stroke-width="4"/>
<text x="1926.6666666666665" y="210" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#246B99">取片目标</text>
<text x="1926.6666666666665" y="360" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">XY约 (199.453, 99.868)</text>
<text x="1926.6666666666665" y="456" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">T = 33°</text>
<text x="1926.6666666666665" y="552" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">Z按取片高度分支</text>
<text x="1200" y="940" font-family="Microsoft YaHei" font-size="49" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#B75D21">中间量显示到三位小数  实际复算使用未舍入值</text></svg>
