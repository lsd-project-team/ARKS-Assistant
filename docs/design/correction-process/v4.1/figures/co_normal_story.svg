<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1040" viewBox="0 0 2400 1040">
<rect width="100%" height="100%" fill="white"/>
<text x="1200" y="70" font-family="Microsoft YaHei" font-size="54" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#172B3A">普通单点对照 不沿用快速模式准备角</text>
<text x="473.3333333333333" y="210" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#246B99">普通准备</text>
<text x="473.3333333333333" y="360" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">示教0° + 产品0°</text>
<text x="473.3333333333333" y="456" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">+ 硬角1° + 校准30°</text>
<text x="473.3333333333333" y="552" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">当前T31°</text>
<polyline points="751.6666666666666,525 911.6666666666666,525" stroke="#246B99" stroke-width="7" fill="none"/>
<polygon points="911.6666666666666,525 887.3545949031444,536.7440694210032 887.3545949031444,513.2559305789968" fill="#246B99" stroke="#246B99" stroke-width="4"/>
<text x="1200.0" y="210" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#246B99">拍 转 再拍</text>
<text x="1200.0" y="360" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">首拍识别2°</text>
<text x="1200.0" y="456" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">相对转2 + 0 + 1 = 3°</text>
<text x="1200.0" y="552" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">转后T34° 再拍位置</text>
<polyline points="1478.3333333333333,525 1638.3333333333333,525" stroke="#246B99" stroke-width="7" fill="none"/>
<polygon points="1638.3333333333333,525 1614.021261569811,536.7440694210032 1614.021261569811,513.2559305789968" fill="#246B99" stroke="#246B99" stroke-width="4"/>
<text x="1926.6666666666665" y="210" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#246B99">贴装读取</text>
<text x="1926.6666666666665" y="360" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">保存角度 −1°</text>
<text x="1926.6666666666665" y="456" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">34 − 1 + 0 + 1</text>
<text x="1926.6666666666665" y="552" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">目标T仍为34°</text>
<text x="1200" y="940" font-family="Microsoft YaHei" font-size="49" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#B75D21">本页转后说明XY偏移 (−0.36, −0.29) 毫米</text></svg>
