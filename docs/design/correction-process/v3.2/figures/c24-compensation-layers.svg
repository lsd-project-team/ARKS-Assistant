<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1210" viewBox="0 0 2400 1210"><rect width="100%" height="100%" fill="white"/>
<text x="1200" y="60" fill="#162e43" font-family="Microsoft YaHei" font-size="60" font-weight="700" text-anchor="middle" dominant-baseline="central">同一运动目标的两个补偿层级</text>
<rect x="80" y="160" width="1050" height="230" fill="#eaf4ed" stroke="#a5b5c1" stroke-width="3"/>
<text x="605.0" y="207.0" fill="#162e43" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central">产品区域补偿</text>
<text x="605.0" y="275.0" fill="#162e43" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central">TU的起点／间距／XY矩阵</text>
<text x="605.0" y="343.0" fill="#162e43" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central">由 IsBondCompensate 控制</text>
<rect x="1300" y="160" width="1020" height="230" fill="#fff0df" stroke="#a5b5c1" stroke-width="3"/>
<text x="1810.0" y="241.0" fill="#162e43" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central">G0贴装目标</text>
<text x="1810.0" y="309.0" fill="#162e43" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central">减去TU区域插值向量</text>
<polyline points="1130,275 1300,275" fill="none" stroke="#4d6070" stroke-width="5"/>
<polygon points="1300,275 1279.2897166458883,285.0042072845583 1279.2897166458883,264.9957927154417" fill="#4d6070"/>
<rect x="1300" y="550" width="1020" height="180" fill="#eaf1f9" stroke="#a5b5c1" stroke-width="3"/>
<text x="1810.0" y="606.0" fill="#162e43" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central">转换到运动轴目标</text>
<text x="1810.0" y="674.0" fill="#162e43" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central">下发运动接口</text>
<polyline points="1810,390 1810,550" fill="none" stroke="#4d6070" stroke-width="5"/>
<polygon points="1810,550 1799.9957927154417,529.2897166458885 1820.0042072845583,529.2897166458885" fill="#4d6070"/>
<rect x="80" y="865" width="1050" height="240" fill="#edf0f3" stroke="#a5b5c1" stroke-width="3"/>
<text x="605.0" y="917.0" fill="#162e43" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central">设备轴二维表</text>
<text x="605.0" y="985.0" fill="#162e43" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central">全局标定／映射文件</text>
<text x="605.0" y="1053.0" fill="#162e43" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central">下载后由驱动接口激活</text>
<rect x="1300" y="865" width="1020" height="240" fill="#eaf1f9" stroke="#a5b5c1" stroke-width="3"/>
<text x="1810.0" y="951.0" fill="#162e43" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central">运动执行层</text>
<text x="1810.0" y="1019.0" fill="#162e43" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central">已激活的轴二维补偿</text>
<polyline points="1810,730 1810,865" fill="none" stroke="#4d6070" stroke-width="5"/>
<polygon points="1810,865 1799.9957927154417,844.2897166458885 1820.0042072845583,844.2897166458885" fill="#4d6070"/>
<polyline points="1130,985 1300,985" fill="none" stroke="#4d6070" stroke-width="5"/>
<polygon points="1300,985 1279.2897166458883,995.0042072845583 1279.2897166458883,974.9957927154417" fill="#4d6070"/>
<text x="605" y="570" fill="#162e43" font-family="Microsoft YaHei" font-size="49" font-weight="700" text-anchor="middle" dominant-baseline="central">独立的数据与开关</text>
