<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1680" viewBox="0 0 2400 1680"><rect width="100%" height="100%" fill="white"/>
<rect x="70" y="40" width="1070" height="210" fill="#eaf1f9" stroke="#a5b5c1" stroke-width="3"/>
<text x="605.0" y="77.0" fill="#162e43" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central">开始采集</text>
<text x="605.0" y="145.0" fill="#162e43" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central">重置窗口缓存并记开始时间</text>
<text x="605.0" y="213.0" fill="#162e43" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central">Machine.Start + 定时查询</text>
<rect x="70" y="365" width="1070" height="210" fill="#eaf1f9" stroke="#a5b5c1" stroke-width="3"/>
<text x="605.0" y="402.0" fill="#162e43" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central">查询并分组</text>
<text x="605.0" y="470.0" fill="#162e43" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central">TU索引 + 基板索引 + 日期</text>
<text x="605.0" y="538.0" fill="#162e43" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central">组内按 ModuleIndex 排序</text>
<rect x="70" y="690" width="1070" height="240" fill="#fff0df" stroke="#a5b5c1" stroke-width="3"/>
<text x="605.0" y="742.0" fill="#162e43" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central">新组先记去重键</text>
<text x="605.0" y="810.0" fill="#162e43" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central">点数等于 R×C → 有效轮</text>
<text x="605.0" y="878.0" fill="#162e43" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central">否则记废轮</text>
<rect x="70" y="1110" width="1070" height="210" fill="#eaf4ed" stroke="#a5b5c1" stroke-width="3"/>
<text x="605.0" y="1181.0" fill="#162e43" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central">有效轮 ≥ K</text>
<text x="605.0" y="1249.0" fill="#162e43" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central">停止设备；取前K轮计算</text>
<polyline points="605,250 605,365" fill="none" stroke="#4d6070" stroke-width="5"/>
<polygon points="605,365 594.9957927154417,344.28971664588846 615.0042072845583,344.28971664588846" fill="#4d6070"/>
<polyline points="605,575 605,690" fill="none" stroke="#4d6070" stroke-width="5"/>
<polygon points="605,690 594.9957927154417,669.2897166458885 615.0042072845583,669.2897166458885" fill="#4d6070"/>
<polyline points="605,930 605,1110" fill="none" stroke="#4d6070" stroke-width="5"/>
<polygon points="605,1110 594.9957927154417,1089.2897166458883 615.0042072845583,1089.2897166458883" fill="#4d6070"/>
<text x="800" y="1015" fill="#162e43" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central">达标</text>
<rect x="1330" y="365" width="1000" height="210" fill="#fff0df" stroke="#a5b5c1" stroke-width="3"/>
<text x="1830.0" y="402.0" fill="#162e43" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central">尚未达标</text>
<text x="1830.0" y="470.0" fill="#162e43" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central">查询组数 ≥ 2K → 停止</text>
<text x="1830.0" y="538.0" fill="#162e43" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central">否则继续查询</text>
<polyline points="1140,810 1225,810 1225,470 1330,470" fill="none" stroke="#b65f17" stroke-width="5"/>
<polygon points="1330,470 1309.2897166458883,480.0042072845583 1309.2897166458883,459.9957927154417" fill="#b65f17"/>
<text x="1775" y="670" fill="#162e43" font-family="Microsoft YaHei" font-size="47" font-weight="400" text-anchor="middle" dominant-baseline="central">查询异常／手动停止：有停机调用</text>
<text x="1775" y="755" fill="#b65f17" font-family="Microsoft YaHei" font-size="47" font-weight="700" text-anchor="middle" dominant-baseline="central">直接关窗：仅停止定时器</text>
<rect x="1330" y="1040" width="1000" height="200" fill="#edf0f3" stroke="#a5b5c1" stroke-width="3"/>
<text x="1830.0" y="1106.0" fill="#162e43" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central">Calculated</text>
<text x="1830.0" y="1174.0" fill="#162e43" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central">预览成功，未发布新矩阵</text>
<rect x="1330" y="1380" width="1000" height="200" fill="#eaf4ed" stroke="#a5b5c1" stroke-width="3"/>
<text x="1830.0" y="1446.0" fill="#162e43" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central">Enabled</text>
<text x="1830.0" y="1514.0" fill="#162e43" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central">赋值XY矩阵并调用 Save</text>
<polyline points="1140,1215 1230,1215 1230,1140 1330,1140" fill="none" stroke="#4d6070" stroke-width="5"/>
<polygon points="1330,1140 1309.2897166458883,1150.0042072845583 1309.2897166458883,1129.9957927154417" fill="#4d6070"/>
<polyline points="1830,1240 1830,1380" fill="none" stroke="#4d6070" stroke-width="5"/>
<polygon points="1830,1380 1819.9957927154417,1359.2897166458883 1840.0042072845583,1359.2897166458883" fill="#4d6070"/>
<text x="2070" y="1310.0" fill="#162e43" font-family="Microsoft YaHei" font-size="46" font-weight="400" text-anchor="middle" dominant-baseline="central">人工启用</text>
<polyline points="605,1320 605,1480 1330,1480" fill="none" stroke="#4d6070" stroke-width="5"/>
<polygon points="1330,1480 1309.2897166458883,1490.0042072845583 1309.2897166458883,1469.9957927154417" fill="#4d6070"/>
<text x="620" y="1580" fill="#162e43" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central">勾选自动启用时直接发布</text></svg>