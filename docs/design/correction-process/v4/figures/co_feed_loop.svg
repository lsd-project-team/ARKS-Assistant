<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1040" viewBox="0 0 2400 1040">
<rect width="100%" height="100%" fill="white"/>
<rect x="50" y="110" width="650" height="220" rx="12" fill="#EDF4F8" stroke="#B7C6CF" stroke-width="4"/>
<text x="375.0" y="174" font-family="Microsoft YaHei" font-size="54" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#172B3A">识别当前芯片</text>
<text x="375.0" y="255" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#647481">标定成XY物理偏差</text>
