<text x="360" y="760" font-family="Microsoft YaHei" font-size="47" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#246B99">有：校正XY后重拍</text>
<rect x="1720" y="540" width="610" height="230" rx="12" fill="#FFF1E4" stroke="#B7C6CF" stroke-width="4"/>
<text x="2025.0" y="604" font-family="Microsoft YaHei" font-size="54" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#172B3A">次数用完</text>
<text x="2025.0" y="685" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#647481">返回未通过</text>
<polyline points="1540,650 1700,650" stroke="#B75D21" stroke-width="7" fill="none"/>
<polygon points="1700,650 1675.6879282364778,661.7440694210032 1675.6879282364778,638.2559305789968" fill="#B75D21" stroke="#B75D21" stroke-width="4"/>
<text x="1615" y="580" font-family="Microsoft YaHei" font-size="48" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#B75D21">无</text>
<text x="1200" y="970" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#B75D21">角度也参加检查  这个校正调用不直接转T</text></svg>
