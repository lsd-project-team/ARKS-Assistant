<text x="2025.0" y="174" font-family="Microsoft YaHei" font-size="54" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#172B3A">自动通过</text>
<text x="2025.0" y="255" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#647481">包含等于阈值</text>
<polyline points="1540,220 1700,220" stroke="#287054" stroke-width="7" fill="none"/>
<polygon points="1700,220 1675.6879282364778,231.74406942100322 1675.6879282364778,208.25593057899678" fill="#287054" stroke="#287054" stroke-width="4"/>
<text x="1615" y="140" font-family="Microsoft YaHei" font-size="48" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#287054">是</text>
<polyline points="1195,350 1195,520" stroke="#B75D21" stroke-width="7" fill="none"/>
<polygon points="1195,520 1183.2559305789969,495.6879282364777 1206.7440694210031,495.6879282364777" fill="#B75D21" stroke="#B75D21" stroke-width="4"/>
<text x="1350" y="435" font-family="Microsoft YaHei" font-size="48" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#B75D21">否</text>
<rect x="870" y="540" width="650" height="230" rx="12" fill="#FFF1E4" stroke="#B7C6CF" stroke-width="4"/>
<text x="1195.0" y="604" font-family="Microsoft YaHei" font-size="54" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#172B3A">检查剩余次数</text>
<text x="1195.0" y="685" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#647481">有次数才校正XY</text>
<polyline points="850,650 375,650 375,350" stroke="#246B99" stroke-width="7" fill="none"/>
