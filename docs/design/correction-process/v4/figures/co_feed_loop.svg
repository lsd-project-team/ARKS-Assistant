<text x="1195.0" y="174" font-family="Microsoft YaHei" font-size="54" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#172B3A">检查XY和角度</text>
<text x="1195.0" y="255" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#647481">全部满足阈值？</text>
<polyline points="720,220 850,220" stroke="#246B99" stroke-width="7" fill="none"/>
<polygon points="850,220 825.6879282364778,231.74406942100322 825.6879282364778,208.25593057899678" fill="#246B99" stroke="#246B99" stroke-width="4"/>
