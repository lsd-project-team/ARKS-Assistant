<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1040" viewBox="0 0 2400 1040">
<rect width="100%" height="100%" fill="white"/>
<text x="1200" y="70" font-family="Microsoft YaHei" font-size="54" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#172B3A">定位角2°  硬角5°  吸嘴校准30°</text>
<text x="473.3333333333333" y="210" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#246B99">未翻转</text>
<text x="473.3333333333333" y="360" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">5 − 2 + 30</text>
<text x="473.3333333333333" y="456" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">取片T = 33°</text>
<text x="1200.0" y="210" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#246B99">翻转</text>
<text x="1200.0" y="360" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">5 + 2 + 30</text>
<text x="1200.0" y="456" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">取片T = 37°</text>
<text x="1926.6666666666665" y="210" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#246B99">偏心接口角</text>
<text x="1926.6666666666665" y="360" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">最终轴角 − 校准角</text>
<text x="1926.6666666666665" y="456" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">分别为3°或7°</text>
<text x="1200" y="940" font-family="Microsoft YaHei" font-size="49" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#B75D21">旋转轴角 芯片角和偏心接口角要分开</text></svg>
