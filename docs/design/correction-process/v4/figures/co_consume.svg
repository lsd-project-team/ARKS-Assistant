<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1040" viewBox="0 0 2400 1040">
<rect width="100%" height="100%" fill="white"/>
<text x="1200" y="70" font-family="Microsoft YaHei" font-size="54" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#172B3A">快速例子的剩余角与偏移使用</text>
<text x="473.3333333333333" y="210" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#246B99">求剩余角</text>
<text x="473.3333333333333" y="360" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">30 + 2 + 5 + 1 = 38°</text>
<text x="473.3333333333333" y="456" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">38 − 30 = 8°</text>
<polyline points="751.6666666666666,525 911.6666666666666,525" stroke="#246B99" stroke-width="7" fill="none"/>
<polygon points="911.6666666666666,525 887.3545949031444,536.7440694210032 887.3545949031444,513.2559305789968" fill="#246B99" stroke="#246B99" stroke-width="4"/>
<text x="1200.0" y="210" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#246B99">偏移转8°</text>
<text x="1200.0" y="360" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">(−0.363414, −0.281243)</text>
<text x="1200.0" y="456" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">转成新的G0追加量</text>
<polyline points="1478.3333333333333,525 1638.3333333333333,525" stroke="#246B99" stroke-width="7" fill="none"/>
<polygon points="1638.3333333333333,525 1614.021261569811,536.7440694210032 1614.021261569811,513.2559305789968" fill="#246B99" stroke="#246B99" stroke-width="4"/>
<text x="1926.6666666666665" y="210" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#246B99">追加到G0</text>
<text x="1926.6666666666665" y="360" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">(−0.320736, −0.329084)</text>
<text x="1926.6666666666665" y="456" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">基础 (100, 200)</text>
<text x="1926.6666666666665" y="552" font-family="Microsoft YaHei" font-size="48" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#172B3A">→ (99.679264, 199.670916)</text>
<text x="1200" y="940" font-family="Microsoft YaHei" font-size="49" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#B75D21">其余补偿本例为0  实际还要转运动轴</text></svg>
