<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1420" viewBox="0 0 2400 1420"><rect width="100%" height="100%" fill="white"/>
<text x="1200" y="65" fill="#162e43" font-family="Microsoft YaHei" font-size="56" font-weight="700" text-anchor="middle" dominant-baseline="central">识别结果是否同时满足位置与角度条件</text>
<rect x="100" y="180" width="600" height="185" fill="#eaf1f9" stroke="#a5b5c1" stroke-width="3"/>
<text x="400.0" y="242.5" fill="#162e43" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central">PR识别</text>
<text x="400.0" y="310.5" fill="#4d6070" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central">取得像素中心与角度</text>
<rect x="900" y="180" width="600" height="185" fill="#eaf1f9" stroke="#a5b5c1" stroke-width="3"/>
<text x="1200.0" y="242.5" fill="#162e43" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central">标定转换与阈值判断</text>
<text x="1200.0" y="310.5" fill="#4d6070" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central">|X|、|Y|、|角度|分别比较</text>
<rect x="1700" y="180" width="600" height="185" fill="#eaf4ed" stroke="#a5b5c1" stroke-width="3"/>
<text x="2000.0" y="242.5" fill="#162e43" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central">通过</text>
<text x="2000.0" y="310.5" fill="#4d6070" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central">返回本次匹配结果</text>
<polyline points="700,270 900,270" fill="none" stroke="#4d6070" stroke-width="4"/>
<polygon points="900,270 879.2897166458885,280.0042072845583 879.2897166458885,259.9957927154417" fill="#4d6070"/>
<polyline points="1500,270 1700,270" fill="none" stroke="#4d6070" stroke-width="4"/>
<polygon points="1700,270 1679.2897166458883,280.0042072845583 1679.2897166458883,259.9957927154417" fill="#4d6070"/>
<text x="1600" y="208" fill="#162e43" font-family="Microsoft YaHei" font-size="42" font-weight="400" text-anchor="middle" dominant-baseline="central">满足</text>
<rect x="900" y="530" width="600" height="185" fill="#eaf1f9" stroke="#a5b5c1" stroke-width="3"/>
<text x="1200.0" y="592.5" fill="#162e43" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central">检查本次次数</text>
<text x="1200.0" y="660.5" fill="#4d6070" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central">是否已达上限</text>
<polyline points="1200,365 1200,530" fill="none" stroke="#4d6070" stroke-width="4"/>
<polygon points="1200,530 1189.9957927154417,509.28971664588846 1210.0042072845583,509.28971664588846" fill="#4d6070"/>
<text x="1300" y="442" fill="#162e43" font-family="Microsoft YaHei" font-size="40" font-weight="400" text-anchor="middle" dominant-baseline="central">未通过</text>
<rect x="1700" y="530" width="600" height="185" fill="#fff0df" stroke="#a5b5c1" stroke-width="3"/>
<text x="2000.0" y="592.5" fill="#162e43" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central">已达上限</text>
<text x="2000.0" y="660.5" fill="#4d6070" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central">返回失败 由外层处理</text>
<polyline points="1500,620 1700,620" fill="none" stroke="#4d6070" stroke-width="4"/>
<polygon points="1700,620 1679.2897166458883,630.0042072845583 1679.2897166458883,609.9957927154417" fill="#4d6070"/>
<rect x="900" y="875" width="600" height="185" fill="#eaf4ed" stroke="#a5b5c1" stroke-width="3"/>
<text x="1200.0" y="937.5" fill="#162e43" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central">仍有次数</text>
<text x="1200.0" y="1005.5" fill="#4d6070" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central">移动XY后重新识别</text>
<polyline points="1200,715 1200,875" fill="none" stroke="#4d6070" stroke-width="4"/>
<polygon points="1200,875 1189.9957927154417,854.2897166458885 1210.0042072845583,854.2897166458885" fill="#4d6070"/>
<polyline points="900,968 400,968 400,365" fill="none" stroke="#4d6070" stroke-width="4"/>
<polygon points="400,365 410.0042072845583,385.71028335411154 389.9957927154417,385.71028335411154" fill="#4d6070"/>
<text x="1200" y="1200" fill="#162e43" font-family="Microsoft YaHei" font-size="50" font-weight="700" text-anchor="middle" dominant-baseline="central">校正调用不直接旋转T轴 角度误差仍参与通过判定</text>
<text x="1200" y="1320" fill="#4d6070" font-family="Microsoft YaHei" font-size="45" font-weight="400" text-anchor="middle" dominant-baseline="central">离线、空跑或IsPositionSearch关闭时 该移动调用可直接返回</text></svg>