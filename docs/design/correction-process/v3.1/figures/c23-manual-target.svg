<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1070" viewBox="0 0 2400 1070"><rect width="100%" height="100%" fill="white"/>
<text x="1200" y="65" fill="#162e43" font-family="Microsoft YaHei" font-size="51" font-weight="700" text-anchor="middle" dominant-baseline="central">同一芯片偏移在两条贴片入口中具有不同使用表达式</text>
<rect x="95" y="180" width="1050" height="710" fill="#fff0df" stroke="#a5b5c1" stroke-width="3"/>
<text x="620" y="255" fill="#162e43" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central">手动PlacementTest</text>
<rect x="1285" y="180" width="1050" height="710" fill="#eaf4ed" stroke="#a5b5c1" stroke-width="3"/>
<text x="1810" y="255" fill="#162e43" font-family="Microsoft YaHei" font-size="52" font-weight="700" text-anchor="middle" dominant-baseline="central">生产上视贴装</text>
<text x="620" y="370" fill="#162e43" font-family="Microsoft YaHei" font-size="46" font-weight="400" text-anchor="middle" dominant-baseline="central">q = (o.X, o.Y, 0)</text>
<text x="620" y="475" fill="#162e43" font-family="Microsoft YaHei" font-size="46" font-weight="400" text-anchor="middle" dominant-baseline="central">SelfPosToG0(q) + o</text>
<text x="620" y="580" fill="#162e43" font-family="Microsoft YaHei" font-size="41" font-weight="400" text-anchor="middle" dominant-baseline="central">局部转换和全局追加均使用o</text>
<text x="620" y="685" fill="#162e43" font-family="Microsoft YaHei" font-size="41" font-weight="400" text-anchor="middle" dominant-baseline="central">例：原点(100,200)，o=(0.1,−0.2)</text>
<text x="620" y="790" fill="#162e43" font-family="Microsoft YaHei" font-size="46" font-weight="700" text-anchor="middle" dominant-baseline="central">输出 (100.2,199.6) mm</text>
<text x="1810" y="370" fill="#162e43" font-family="Microsoft YaHei" font-size="46" font-weight="400" text-anchor="middle" dominant-baseline="central">产品硬补偿 → G0目标</text>
<text x="1810" y="475" fill="#162e43" font-family="Microsoft YaHei" font-size="46" font-weight="400" text-anchor="middle" dominant-baseline="central">按剩余角旋转o后追加</text>
<text x="1810" y="580" fill="#162e43" font-family="Microsoft YaHei" font-size="41" font-weight="400" text-anchor="middle" dominant-baseline="central">配置硬补偿与芯片偏移分别产生</text>
<text x="1810" y="685" fill="#162e43" font-family="Microsoft YaHei" font-size="41" font-weight="400" text-anchor="middle" dominant-baseline="central">例：剩余角=0，其余补偿=0</text>
<text x="1810" y="790" fill="#162e43" font-family="Microsoft YaHei" font-size="46" font-weight="700" text-anchor="middle" dominant-baseline="central">输出 (100.1,199.8) mm</text>
<text x="1200" y="990" fill="#4d6070" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central">本例父链角为0且轴转换取恒等输入  Z另由高度流程计算</text></svg>