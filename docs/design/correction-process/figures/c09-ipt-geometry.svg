<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1030" viewBox="0 0 2400 1030"><rect width="100%" height="100%" fill="white"/>
<rect x="60" y="220" width="450" height="270" fill="#edf3f8" stroke="#a8bac7" stroke-width="3"/>
<text x="285.0" y="282" fill="#18364b" font-family="Microsoft YaHei" font-size="50" font-weight="700" text-anchor="middle" dominant-baseline="central">示教相对向量</text>
<text x="285.0" y="357" fill="#5a6e7f" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central">芯片中心 C</text>
<text x="285.0" y="415" fill="#5a6e7f" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central">减 Mark 中心 P</text>
<polyline points="510,355 670,355" fill="none" stroke="#315d82" stroke-width="4"/>
<polygon points="670,355 649.2897166458885,365.0042072845583 649.2897166458885,344.9957927154417" fill="#315d82"/>
<rect x="670" y="220" width="450" height="270" fill="#edf3f8" stroke="#a8bac7" stroke-width="3"/>
<text x="895.0" y="282" fill="#18364b" font-family="Microsoft YaHei" font-size="50" font-weight="700" text-anchor="middle" dominant-baseline="central">旋转相对向量</text>
<text x="895.0" y="357" fill="#5a6e7f" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central">角度 −(a + a0)</text>
<text x="895.0" y="415" fill="#5a6e7f" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central">单点或双点均角</text>
<polyline points="1120,355 1280,355" fill="none" stroke="#315d82" stroke-width="4"/>
<polygon points="1280,355 1259.2897166458883,365.0042072845583 1259.2897166458883,344.9957927154417" fill="#315d82"/>
<rect x="1280" y="220" width="450" height="270" fill="#edf3f8" stroke="#a8bac7" stroke-width="3"/>
<text x="1505.0" y="282" fill="#18364b" font-family="Microsoft YaHei" font-size="50" font-weight="700" text-anchor="middle" dominant-baseline="central">锚定本次 Mark</text>
<text x="1505.0" y="357" fill="#5a6e7f" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central">加识别中心 P′</text>
<text x="1505.0" y="415" fill="#5a6e7f" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central">实际芯片中心 C′</text>
<polyline points="1730,355 1890,355" fill="none" stroke="#315d82" stroke-width="4"/>
<polygon points="1890,355 1869.2897166458883,365.0042072845583 1869.2897166458883,344.9957927154417" fill="#315d82"/>
<rect x="1890" y="220" width="450" height="270" fill="#eef5f0" stroke="#a8bac7" stroke-width="3"/>
<text x="2115.0" y="282" fill="#18364b" font-family="Microsoft YaHei" font-size="50" font-weight="700" text-anchor="middle" dominant-baseline="central">修正取片目标</text>
<text x="2115.0" y="357" fill="#5a6e7f" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central">C′ + H − E</text>
<text x="2115.0" y="415" fill="#5a6e7f" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central">使用新 T 查询 E</text>
<text x="1200" y="85" fill="#18364b" font-family="Microsoft YaHei" font-size="50" font-weight="700" text-anchor="middle" dominant-baseline="central">先求芯片中心   再换算为吸嘴应到达的位置</text>
<rect x="110" y="680" width="1000" height="250" fill="#f5f7f9" stroke="#a8bac7" stroke-width="3"/>
<text x="610.0" y="742" fill="#18364b" font-family="Microsoft YaHei" font-size="50" font-weight="700" text-anchor="middle" dominant-baseline="central">单点</text>
<text x="610.0" y="817" fill="#5a6e7f" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central">P = 示教 P1</text>
<text x="610.0" y="875" fill="#5a6e7f" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central">P′ = 本次识别 P1</text>
<rect x="1290" y="680" width="1000" height="250" fill="#f5f7f9" stroke="#a8bac7" stroke-width="3"/>
<text x="1790.0" y="742" fill="#18364b" font-family="Microsoft YaHei" font-size="50" font-weight="700" text-anchor="middle" dominant-baseline="central">双点</text>
<text x="1790.0" y="817" fill="#5a6e7f" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central">P = 两个示教 Mark 中点</text>
<text x="1790.0" y="875" fill="#5a6e7f" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central">P′ = 两个识别 Mark 中点</text>
<text x="1200" y="980" fill="#5a6e7f" font-family="Microsoft YaHei" font-size="42" font-weight="400" text-anchor="middle" dominant-baseline="central">H 头相机差   E 新取片角下的吸嘴偏心   位置采用同一物理参考</text></svg>