<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1080" viewBox="0 0 2400 1080"><rect width="100%" height="100%" fill="white"/>
<rect x="60" y="180" width="600" height="220" fill="#edf3f8" stroke="#a8bac7" stroke-width="3"/>
<text x="360.0" y="242" fill="#18364b" font-family="Microsoft YaHei" font-size="50" font-weight="700" text-anchor="middle" dominant-baseline="central">先执行 Pick</text>
<text x="360.0" y="317" fill="#5a6e7f" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central">实际取片调用</text>
<circle cx="810" cy="290" r="42" fill="#c58737"/>
<text x="810" y="290" fill="white" font-family="Microsoft YaHei" font-size="44" font-weight="700" text-anchor="middle" dominant-baseline="central">R</text>
<rect x="990" y="180" width="600" height="220" fill="#edf3f8" stroke="#a8bac7" stroke-width="3"/>
<text x="1290.0" y="242" fill="#18364b" font-family="Microsoft YaHei" font-size="50" font-weight="700" text-anchor="middle" dominant-baseline="central">真空检测</text>
<text x="1290.0" y="317" fill="#5a6e7f" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central">RePick 标签之后</text>
<rect x="1800" y="180" width="540" height="220" fill="#eef5f0" stroke="#a8bac7" stroke-width="3"/>
<text x="2070.0" y="242" fill="#18364b" font-family="Microsoft YaHei" font-size="50" font-weight="700" text-anchor="middle" dominant-baseline="central">继续后续处理</text>
<text x="2070.0" y="317" fill="#5a6e7f" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central">检测通过</text>
<polyline points="660,290 768,290" fill="none" stroke="#315d82" stroke-width="4"/>
