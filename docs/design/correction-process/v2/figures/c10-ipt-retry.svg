<rect x="890" y="600" width="800" height="220" fill="#faf1e4" stroke="#a8bac7" stroke-width="3"/>
<text x="1290.0" y="662" fill="#18364b" font-family="Microsoft YaHei" font-size="50" font-weight="700" text-anchor="middle" dominant-baseline="central">检测失败选择 Retry</text>
<text x="1290.0" y="737" fill="#5a6e7f" font-family="Microsoft YaHei" font-size="44" font-weight="400" text-anchor="middle" dominant-baseline="central">goto RePick</text>
<polyline points="890,710 810,710" fill="none" stroke="#c58737" stroke-width="4"/>
<polygon points="810,710 830.7102833541115,699.9957927154417 830.7102833541115,720.0042072845583" fill="#c58737"/>
<circle cx="768" cy="710" r="42" fill="#c58737"/>
<text x="768" y="710" fill="white" font-family="Microsoft YaHei" font-size="44" font-weight="700" text-anchor="middle" dominant-baseline="central">R</text>
<text x="1200" y="920" fill="#18364b" font-family="Microsoft YaHei" font-size="46" font-weight="700" text-anchor="middle" dominant-baseline="central">相同的 R 表示跳转目标   RePick 在 Pick 之后</text>
<text x="1200" y="1010" fill="#5a6e7f" font-family="Microsoft YaHei" font-size="42" font-weight="400" text-anchor="middle" dominant-baseline="central">视觉失败 Ignore 分支另有 Repick 标签，位于其 PickAction 之前</text></svg>