44 与 00~30 负责「结论是什么」","_atlas 负责「30 秒看懂」"]},{"title":"只留一层会缺东西","items":["只留图：细节全丢，改代码没依据","只留文档：8000 行的文件没人从头读","只留 raw：碎、重复、没有结论"]},{"title":"从哪进","items":["第一次来：先开 index.html","要改代码：按编号找源文档","要核对结论：回 _raw 查原始记录"]}]}];
const q = document.getElementById('q'), out = document.getElementById('out'), hint = document.getElementById('hint');
const ESC = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'};
const esc = s => String(s).replace(/[&<>"]/g, c => ESC[c]);
function hl(s, k) {
  if (!k) return esc(s);
  const i = s.toLowerCase().indexOf(k.toLowerCase());
  if (i < 0) return esc(s);
  return esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + k.length)) + '</mark>' + esc(s.slice(i + k.length));
}
function run() {
  const k = q.value.trim();
  if (!k) {
    out.innerHTML = '';
    hint.textContent = '共 ' + DATA.length + ' 张图，' + DATA.reduce((a, b) => a + b.nodes.length, 0) + ' 个节点。输入关键词开始搜索。';
    return;
  }
  let total = 0, html = '';
  for (const d of DATA) {
    const hits = [];
    if ((d.title + ' ' + d.desc).toLowerCase().includes(k.toLowerCase()))
      hits.push('<div class="body">图标题命中：' + hl(d.title, k) + '</div>');
    for (const n of d.nodes) {
      if ((n.label + ' ' + n.sub).toLowerCase().includes(k.toLowerCase()))
        hits.push('<div class="body">节点：<a href="' + encodeURI(d.id) + '.html#focus=' + n.id + '">' + hl(n.label, k) + '</a>' +
          (n.sub ? ' <span class="kind">' + hl(n.sub, k) + '</span>' : '') + '</div>');
    }
    for (const c of d.cards) {
      if (c.title.toLowerCase().includes(k.toLowerCase())) hits.push('<div class="body">卡片：' + hl(c.title, k) + '</div>');
      for (const it of (c.items || [])) if (it.toLowerCase().includes(k.toLowerCase())) hits.push('<div class="body">· ' + hl(it, k) + '</div>');
    }
    if (hits.length) {
      total += 1;
      html += '<div class="hit"><a href="' + encodeURI(d.id) + '.html">' + esc(d.title) + '</a><span class="kind">' + d.type + '</span>' + hits.slice(0, 6).join('') + '</div>';
    }
  }
  out.innerHTML = total ? html : '<div class="empty">没有命中。换个词试试，或者 <a href="start.html">回导读</a> 按路线看。</div>';
  hint.textContent = total ? '命中 ' + total + ' 张图（每张最多显示 6 条）' : '';
}
q.addEventListener('input', run);
const pre = new URLSearchParams(location.search).get('q');
if (pre) q.value = pre;
run();
