<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">鹈鹕骑自行车</title>
  <desc id="desc">一只橙色嘴巴的鹈鹕在海边骑着蓝色自行车，车轮和海浪持续动画。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b7e8f5"/><stop offset="1" stop-color="#fff4d8"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#61c4d5"/><stop offset="1" stop-color="#167ea0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
    <g id="wheel"><circle r="70" fill="#f4fbff" stroke="#153d5b" stroke-width="9"/><g stroke="#8db5c6" stroke-width="3"><path d="M0-66V66M-66 0H66M-47-47L47 47M47-47L-47 47"/></g><circle r="9" fill="#e87642" stroke="#153d5b" stroke-width="5"/></g>
  </defs>
  <rect width="1000" height="600" fill="url(#sky)"/>
  <circle cx="790" cy="110" r="58" fill="#ffd66e" opacity=".9"/>
  <path d="M0 400 Q180 350 350 395 T700 390 T1000 380 V600H0Z" fill="url(#sea)"/>
  <path d="M0 436 Q90 416 180 436 T360 436 T540 436 T720 436 T900 436 T1080 436" fill="none" stroke="#b9f4f4" stroke-width="8" opacity=".8">
    <animateTransform attributeName="transform" type="translate" values="0 0;-90 0;0 0" dur="4s" repeatCount="indefinite"/>
  </path>
  <path d="M0 498 Q120 478 240 498 T480 498 T720 498 T960 498 T1200 498" fill="none" stroke="#7be1df" stroke-width="5" opacity=".7">
    <animateTransform attributeName="transform" type="translate" values="0 0;-120 0;0 0" dur="5s" repeatCount="indefinite"/>
  </path>
  <ellipse cx="500" cy="520" rx="270" ry="24" fill="#0c6077" opacity=".25" filter="url(#shadow)"/>
  <g transform="translate(495 0)">
    <g transform="translate(-120 425)"><use href="#wheel"/></g>
    <g transform="translate(120 425)"><use href="#wheel"/></g>
    <path d="M-120 425 L-38 330 L120 425 L-120 425 L-38 330 L18 425 M-38 330 L-2 330" fill="none" stroke="#e87642" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M100 420 L135 372 L156 335" fill="none" stroke="#153d5b" stroke-width="8" stroke-linecap="round"/>
    <path d="M140 335 h40" stroke="#153d5b" stroke-width="8" stroke-linecap="round"/>
    <g transform="translate(0 0)">
      <g transform="translate(0 0)">
        <path d="M-25 300 Q-15 225 22 181 Q66 132 112 158 Q146 179 128 235 L92 317 Q72 342 26 335Z" fill="#f3f7f5" stroke="#153d5b" stroke-width="8"/>
        <path d="M35 188 Q68 122 130 104 Q195 86 224 126 Q238 153 213 175 Q174 205 129 207Z" fill="#f3f7f5" stroke="#153d5b" stroke-width="8"/>
        <path d="M195 130 Q263 123 318 153 Q334 164 317 180 Q244 210 178 181Z" fill="#f28b43" stroke="#153d5b" stroke-width="8" stroke-linejoin="round"/>
        <path d="M214 153 Q270 149 315 166 Q250 190 210 175Z" fill="#ffb36b" opacity=".75"/>
        <circle cx="186" cy="132" r="10" fill="#153d5b"/><circle cx="189" cy="129" r="3" fill="white"/>
        <path d="M108 110 Q94 68 126 49 Q162 30 186 59 Q198 77 184 105" fill="#f3f7f5" stroke="#153d5b" stroke-width="8"/>
        <path d="M58 213 Q4 246 10 302" fill="none" stroke="#c5dfdd" stroke-width="18" stroke-linecap="round"/>
        <path d="M83 214 Q126 257 109 318" fill="none" stroke="#d7ebe9" stroke-width="17" stroke-linecap="round"/>
        <path d="M43 327 L-12 393 M84 328 L45 397" fill="none" stroke="#f28b43" stroke-width="18" stroke-linecap="round"/>
        <path d="M-17 392 l-26 15 M45 396 l-28 18" stroke="#153d5b" stroke-width="7" stroke-linecap="round"/>
        <path d="M-30 302 Q-64 330 -60 364" fill="none" stroke="#153d5b" stroke-width="7" stroke-linecap="round"/>
      </g>
    </g>
    <g transform="translate(-38 330)">
      <circle r="14" fill="#f28b43" stroke="#153d5b" stroke-width="5"/>
      <path d="M0 0 L-28 45 M0 0 L38 26" stroke="#153d5b" stroke-width="7" stroke-linecap="round"/>
      <g transform-origin="0 0"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="1.2s" repeatCount="indefinite"/></g>
    </g>
    <g transform="translate(-38 330)"><circle r="7" fill="#fff1c1"/></g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur=".65s" repeatCount="indefinite"/>
