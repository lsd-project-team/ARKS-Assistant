  <g fill="#fff" opacity=".85"><path d="M150 126 q18-20 36 0 q18-20 36 0 q-18 23-36 0 q-18 23-36 0Z"/><path d="M570 88 q16-18 32 0 q16-18 32 0 q-16 20-32 0 q-16 20-32 0Z"/></g>
  <text x="500" y="570" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#e8ffff" opacity=".9">Pelican on the move</text>
</svg>
