<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">ZX2200 系统与流程主链</title>
  <desc id="desc">从启动、输送、S1 点胶到 S2 固晶的生产主线介绍图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b82dc"/>
      <stop offset="1" stop-color="#7c9fe3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="270" rx="18" fill="url(#bg)" stroke="#d7e0ec"/>
  <circle cx="1054" cy="-24" r="194" fill="none" stroke="#c9d9ef" stroke-width="2"/>
  <circle cx="1054" cy="-24" r="146" fill="none" stroke="#dce7f5" stroke-width="20"/>
  <path d="M48 208H1138" stroke="#d6e1ef"/>
  <text x="48" y="50" fill="#4f6f9c" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" letter-spacing="2.4">ZX2200 · 系统与流程</text>
  <text x="48" y="94" fill="#1f2d3d" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="30" font-weight="650">从生产全局读懂每个环节</text>
  <text x="48" y="126" fill="#5d6b7b" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">沿主流程查看模块职责、协作关系与异常处理</text>
  <text x="48" y="177" fill="#58739d" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" letter-spacing="1.2">主链 · 生产执行</text>
  <path d="M126 232H814" stroke="url(#line)" stroke-width="2"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">
    <g><rect x="48" y="212" width="146" height="38" rx="9" fill="#fff" stroke="#9eb8df"/><text x="121" y="237" fill="#2e5fa8">启动</text></g>
    <circle cx="218" cy="231" r="4" fill="#5e87cf"/><path d="M228 231h25" stroke="#7c9fe3" stroke-width="2"/><path d="m248 226 7 5-7 5" fill="none" stroke="#7c9fe3" stroke-width="2"/>
    <g><rect x="270" y="212" width="146" height="38" rx="9" fill="#fff" stroke="#9eb8df"/><text x="343" y="237" fill="#2e5fa8">输送</text></g>
    <circle cx="440" cy="231" r="4" fill="#5e87cf"/><path d="M450 231h25" stroke="#7c9fe3" stroke-width="2"/><path d="m470 226 7 5-7 5" fill="none" stroke="#7c9fe3" stroke-width="2"/>
    <g><rect x="492" y="212" width="146" height="38" rx="9" fill="#fff" stroke="#9eb8df"/><text x="565" y="237" fill="#2e5fa8">S1 点胶</text></g>
    <circle cx="662" cy="231" r="4" fill="#5e87cf"/><path d="M672 231h25" stroke="#7c9fe3" stroke-width="2"/><path d="m692 226 7 5-7 5" fill="none" stroke="#7c9fe3" stroke-width="2"/>
    <g><rect x="714" y="212" width="146" height="38" rx="9" fill="#fff" stroke="#9eb8df"/><text x="787" y="237" fill="#2e5fa8">S2 固晶</text></g>
  </g>
</svg>
